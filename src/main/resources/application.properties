spring.datasource.url=jdbc:mysql://localhost:3306/db_alumno?useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Muestra SQL en consola (útil para desarrollo).
spring.jpa.show-sql=true
